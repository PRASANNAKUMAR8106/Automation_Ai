spring:
  application:
    name: autoflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-none}|%X{tenantId:-none}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.autoflow: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

autoflow:
  channels:
    token-encryption-key: ${CHANNEL_TOKEN_ENCRYPTION_KEY:autoflow_aes256_secret_key_32b!}
    refresh-cron: ${CHANNEL_REFRESH_CRON:0 0 3 * * *}
    meta:
      app-id: ${META_APP_ID:dummy_meta_app_id}
      app-secret: ${META_APP_SECRET:dummy_meta_app_secret}
      redirect-uri: ${META_REDIRECT_URI:http://localhost:8080/api/v1/channels/oauth/callback/INSTAGRAM}
      graph-api-base-url: ${META_GRAPH_API_URL:https://graph.facebook.com/v19.0}
    telegram:
      bot-token: ${TELEGRAM_BOT_TOKEN:dummy_telegram_bot_token}
      bot-username: ${TELEGRAM_BOT_USERNAME:autoflow_demo_bot}
      webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:autoflow_telegram_secret_2026}
      api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}

