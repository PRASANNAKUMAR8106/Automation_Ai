# AutoFlow AI Local Redis Configuration
# Port and binding
port 6379
bind 0.0.0.0

# Security
requirepass autoflow_redis_pass_2026

# Persistence (AOF enabled for stream safety)
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory management
maxmemory 256mb
maxmemory-policy noeviction
