# Production Docker Compose Configuration for AutoFlow AI
# Cost-aware Single-VM Modular-Monolith Architecture ($20-$40/month VPS)

services:
  # Automated TLS Reverse Proxy (Caddy 2)
  caddy:
    image: caddy:2.8-alpine
    container_name: autoflow_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 QUIC
    volumes:
      - ./autoflow-infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - autoflow_prod_net

  # Core Backend Modular Monolith (Spring Boot 3.3 / Java 21)
  backend:
    build:
      context: ./autoflow-backend
      dockerfile: Dockerfile
    container_name: autoflow_backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-autoflow_prod_db}
      DB_USER: ${DB_USER:-autoflow_app}
      DB_PASSWORD: ${DB_PASSWORD:?Database password required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret key required}
      CHANNEL_TOKEN_ENCRYPTION_KEY: ${CHANNEL_TOKEN_ENCRYPTION_KEY:?Channel encryption key required}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-autoflow_minio_admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?MinIO secret required}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-autoflow_demo_bot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 1024M
    networks:
      - autoflow_prod_net

  # Web Dashboard & Workflow Canvas (Flutter Web + Nginx)
  frontend:
    build:
      context: ./autoflow-app
      dockerfile: Dockerfile
    container_name: autoflow_frontend
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - autoflow_prod_net

  # PostgreSQL 16 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: autoflow_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-autoflow_prod_db}
      POSTGRES_USER: ${DB_USER:-autoflow_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./autoflow-infra/docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-autoflow_app} -d ${DB_NAME:-autoflow_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    networks:
      - autoflow_prod_net

  # Redis 7 with AOF Persistence & Authentication
  redis:
    image: redis:7.2-alpine
    container_name: autoflow_redis_prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    networks:
      - autoflow_prod_net

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: autoflow_minio_prod
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-autoflow_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    command: server /data
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - autoflow_prod_net

  # MinIO Bucket Auto-Provisioner & Security Policy (Private by default)
  minio-init:
    image: minio/mc:latest
    container_name: autoflow_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-autoflow_minio_admin} ${S3_SECRET_KEY};
      /usr/bin/mc mb --ignore-existing myminio/autoflow-media;
      /usr/bin/mc mb --ignore-existing myminio/autoflow-invoices;
      /usr/bin/mc mb --ignore-existing myminio/autoflow-public;
      /usr/bin/mc anonymous set download myminio/autoflow-public;
      exit 0;
      "
    networks:
      - autoflow_prod_net

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  autoflow_prod_net:
    driver: bridge
